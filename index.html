<style>
:root{color-scheme:light dark;--bg:#FFFFFF;--text:#111111;--muted:#5C5C61;--line:#D8D8DC;--link:#0A60D6}

.lead{margin-top:20px;color:var(--muted)}
h2{margin:40px 0 8px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
p,address{font-style:normal;overflow-wrap:anywhere}
a{color:var(--link);text-underline-offset:3px}
.rule{height:1px;background:var(--line);margin-top:44px}
footer{max-width:640px;width:100%;margin:0 auto;padding:0 24px 36px;color:var(--muted);font-size:14px}
